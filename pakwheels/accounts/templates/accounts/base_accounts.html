<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Accounts{% endblock %}</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 400px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      label {
        font-weight: 500;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        padding: 0.5rem;
      }
      button,
      .btn {
        padding: 0.5rem 1rem;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }
      .errorlist {
        color: #c00;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
